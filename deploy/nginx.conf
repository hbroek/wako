# Behind nginx, wako listens on 127.0.0.1:8888 (the default) and trusts only this machine.
server {
    listen 443 ssl http2;
    server_name wiki.example.com;
    # ssl_certificate / ssl_certificate_key ...

    client_max_body_size 300m;          # image uploads and space imports

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 150s;      # an AI answer can take up to two minutes
    }
}
